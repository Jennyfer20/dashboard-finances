<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BudgetLab - Inscription</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="/static/favicon.png" type="image/png">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#3b82f6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="/static/icon-192x192.png">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="auth-body">

    <div class="auth-bocode static\style.cssx">
        <h1 class="logo">BudgetLab</h1>
        <h2>Creer un compte</h2>
        <div class="formulaire">
            <div class="mode-choice">
                <button type="button" id="mode-perso" class="mode-btn active" onclick="choisirMode('perso')">Personnel</button>
                <button type="button" id="mode-entreprise" class="mode-btn" onclick="choisirMode('entreprise')">Entreprise</button>
            </div>
            <input type="hidden" id="reg-mode" value="perso">
            <input type="text" id="reg-nom" placeholder="Ton nom">
            <div class="mode-choice">
                <button type="button" id="mode-perso" class="mode-btn active" onclick="choisirMode('perso')">Personnel</button>
                <button type="button" id="mode-entreprise" class="mode-btn" onclick="choisirMode('entreprise')">Entreprise</button>
            </div>
            <input type="hidden" id="reg-mode" value="perso">
            <input type="email" id="reg-email" placeholder="Email">
            <div class="password-field">
                <input type="password" id="reg-mdp" placeholder="Mot de passe">
                <i data-lucide="eye" class="toggle-password-icon" onclick="togglePassword('reg-mdp', this)"></i>
            </div>
            <div class="password-field">
                <input type="password" id="reg-mdp2" placeholder="Confirmer le mot de passe">
                <i data-lucide="eye" class="toggle-password-icon" onclick="togglePassword('reg-mdp2', this)"></i>
            </div>
            <button id="btn-register" class="btn-primary">S'inscrire</button>
            <p id="reg-erreur" class="erreur"></p>
        </div>
        <p class="auth-link">Deja un compte ? <a href="/login">Se connecter</a></p>
    </div>

    <script>
    lucide.createIcons();

    function togglePassword(inputId, icon) {
        var input = document.getElementById(inputId);
        if (input.type === "password") {
            input.type = "text";
            icon.setAttribute("data-lucide", "eye-off");
        } else {
            input.type = "password";
            icon.setAttribute("data-lucide", "eye");
        }
        lucide.createIcons();
    }
    window.choisirMode = function(mode) {
        document.getElementById("reg-mode").value = mode;
        document.getElementById("mode-perso").classList.remove("active");
        document.getElementById("mode-entreprise").classList.remove("active");
        document.getElementById("mode-" + mode).classList.add("active");
    };
    window.choisirMode = function(mode) {
        document.getElementById("reg-mode").value = mode;
        document.getElementById("mode-perso").classList.remove("active");
        document.getElementById("mode-entreprise").classList.remove("active");
        document.getElementById("mode-" + mode).classList.add("active");
    };

    document.getElementById("btn-register").addEventListener("click", function() {
        var nom = document.getElementById("reg-nom").value;
        var email = document.getElementById("reg-email").value;
        var mdp = document.getElementById("reg-mdp").value;
        var mdp2 = document.getElementById("reg-mdp2").value;
        if (!nom || !email || !mdp || !mdp2) {
            document.getElementById("reg-erreur").textContent = "Remplis tous les champs !";
            return;
        }
        if (mdp !== mdp2) {
            document.getElementById("reg-erreur").textContent = "Les mots de passe ne correspondent pas !";
            return;
        }
        fetch("/api/register", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body:JSON.stringify({nom: nom, email: email, mot_de_passe: mdp, mode: document.getElementById("reg-mode").value})
        })

        .then(function(data) {
            if (data.succes) {
                window.location.href = "/dashboard";
            } else {
                document.getElementById("reg-erreur").textContent = data.erreur;
            }
        });
    });
    </script>

</body>
</html>
