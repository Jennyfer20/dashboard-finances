<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BudgetLab - Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="/static/favicon.png" type="image/png">
</head>
<body class="dashboard-body">

    <div class="sidebar">
        <h2>💰 BudgetLab</h2>
        <a href="#" class="active" onclick="changerPage('dashboard')">Tableau de bord</a>
        <a href="#" onclick="changerPage('transactions')">Transactions</a>
        <a href="/api/logout" class="logout-link">Deconnexion</a>
    </div>

    <div class="main">

        <div class="header">
            <h1 id="titre-page">Bonjour, {{ user_nom }} 👋</h1>
            <div class="theme-buttons">
                <button id="btn-clair" class="btn-actif">Mode Clair</button>
                <button id="btn-sombre">Mode Sombre</button>
            </div>
        </div>

        <div id="page-dashboard" class="page">
            <div class="cartes">
                <div class="carte carte-solde">
                    <h3>Solde</h3>
                    <p id="val-solde">Chargement...</p>
                </div>
                <div class="carte carte-revenus">
                    <h3>Revenus</h3>
                    <p id="val-revenus">Chargement...</p>
                </div>
                <div class="carte carte-depenses">
                    <h3>Depenses</h3>
                    <p id="val-depenses">Chargement...</p>
                </div>
                <div class="carte carte-transactions">
                    <h3>Transactions</h3>
                    <p id="val-transactions">Chargement...</p>
                </div>
            </div>

            <div class="graphiques">
                <div class="graphique-box">
                    <h3>Depenses par categorie</h3>
                    <canvas id="graphique-depenses"></canvas>
                </div>
                <div class="graphique-box formulaire-box">
                    <h3>Ajouter une transaction</h3>
                    <div class="formulaire">
                        <select id="form-type">
                            <option value="depense">Depense</option>
                            <option value="revenu">Revenu</option>
                        </select>
                        <input type="text" id="form-categorie" placeholder="Categorie (ex: Nourriture)">
                        <input type="number" id="form-montant" placeholder="Montant (FCFA)">
                        <input type="text" id="form-description" placeholder="Description">
                        <button id="btn-ajouter">Ajouter</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="page-transactions" class="page" style="display:none;">
            <div class="filtres">
                <select id="filtre-categorie">
                    <option value="">Toutes les categories</option>
                </select>
                <input type="date" id="filtre-date-debut">
                <input type="date" id="filtre-date-fin">
                <button id="btn-filtrer">Filtrer</button>
                <button id="btn-reset" class="btn-secondary">Reset</button>
            </div>
            <div class="section-transactions">
                <h3>Toutes les transactions</h3>
                <div id="liste-transactions">Chargement...</div>
            </div>
        </div>

        <div id="popup-modifier" class="popup-overlay" style="display:none;">
            <div class="popup-box">
                <h3>Modifier la transaction</h3>
                <div class="formulaire">
                    <input type="hidden" id="edit-id">
                    <select id="edit-type">
                        <option value="depense">Depense</option>
                        <option value="revenu">Revenu</option>
                    </select>
                    <input type="text" id="edit-categorie" placeholder="Categorie">
                    <input type="number" id="edit-montant" placeholder="Montant (FCFA)">
                    <input type="text" id="edit-description" placeholder="Description">
                    <div class="popup-buttons">
                        <button id="btn-sauvegarder">Sauvegarder</button>
                        <button id="btn-annuler" class="btn-secondary">Annuler</button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/static/script.js"></script>
</body>
</html>
